<<: !include common.yaml

esphome:
  name: esp32-c3-idf

esp32:
  board: adafruit_qtpy_esp32c3
  framework:
    type: esp-idf
    version: 5.4.1
    platform_version: 54.03.20

esp32_ble_tracker:
  max_connections: 3
  scan_parameters:
    period: 0min
    duration: 0min
    active: True
    continuous: False
  on_ble_advertise:
    - then:
        # yamllint disable rule:line-length
        - lambda: !lambda |-
            ESP_LOGI("main", "Received %s %s", x.address_str().c_str(), x.get_name().c_str());
        # yamllint enable rule:line-length

mqtt:
  broker: 192.168.3.8
  username: esphome
  password: "n7y0%P0tfXPkoWYA0XAaW2"
  client_id: esp32_c6_idf

api:
  reboot_timeout: 0s
  encryption:
    key: "GA0IRiX7NtqnXQXQBETMxbpphAMV1Q8VDt/IE2FDVRU="

switch:
  - platform: template
    name: "BLE Scanning"
    id: ble_scanning_switch
    optimistic: true
    turn_on_action:
      - logger.log: "Turning on BLE scanning"
      - esp32_ble_tracker.start_scan:
    turn_off_action:
      - logger.log: "Turning off BLE scanning"
      - esp32_ble_tracker.stop_scan:

logger:
  level: VERBOSE
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG

bluetooth_proxy:
  active: true
  connection_slots: 3

button:
  - platform: restart
    name: "Living Room Restart"

sensor:
  - platform: uptime
    type: seconds
    name: Uptime Sensor
    internal: True

web_server:
  include_internal: True
