<<: !include common.yaml

esphome:
  name: esp32-c6-idf
  on_boot:
    then:
      - delay:
          seconds: 60
      - esp32_ble_tracker.start_scan:
  includes:
    - <esp_core_dump.h>

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf
    version: 5.4.1
    platform_version: 54.03.20

esp32_ble_tracker:
  id: tracker
  max_connections: 3
  scan_parameters:
    period: 0min
    duration: 0min
    window:
      milliseconds: 10
    interval:
      milliseconds: 10
    active: True
    continuous: False
  on_ble_advertise:
    - then:
        # yamllint disable rule:line-length
        - lambda: !lambda |-
            ESP_LOGI("main", "Received %s %s", x.address_str().c_str(), x.get_name().c_str());
        # yamllint enable rule:line-length

api:
  reboot_timeout: 0s
  encryption:
    key: "GA0IRiX7NtqnXQXQBETMxbpphAMV1Q8VDt/IE2FDVRU="

switch:
  - platform: template
    name: "BLE Scanning"
    id: ble_scanning_switch
    optimistic: true
    lambda: |-
      if (id(tracker).get_scanner_state() == esphome::esp32_ble_tracker::ScannerState::RUNNING) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      - logger.log: "Turning on BLE scanning"
      - esp32_ble_tracker.start_scan:
    turn_off_action:
      - logger.log: "Turning off BLE scanning"
      - esp32_ble_tracker.stop_scan:

logger:
  level: DEBUG
  baud_rate: 115200
  hardware_uart: UART0

bluetooth_proxy:
  active: true
  connection_slots: 3

button:
  - platform: restart
    name: "Living Room Restart"

sensor:
  - platform: uptime
    name: Uptime Sensor
binary_sensor:
  - platform: template
    name: Coredump
    lambda: |-
      esp_core_dump_summary_t summary;
      if (esp_core_dump_get_summary(&summary) == ESP_OK) {
        return true;
      } else {
        return false;
      }

external_components:
  - source: github://soldierkam/esphome-components
    components: [coredump, partitions]
    refresh: 1s

coredump:
  enable_test_crash: True
